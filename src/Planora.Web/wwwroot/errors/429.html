<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Too Many Requests - Planora</title>

    <link rel="stylesheet"
          href="/css/errors.css">

</head>

<body>

<header class="error-topbar">

    <a href="/"
       class="error-brand">

        <span class="error-brand-mark">P</span>
        <span>Planora</span>

    </a>

</header>


<main class="error-page">

<section class="error-shell">

    <div class="error-copy">

        <span class="error-kicker">
            REQUEST LIMIT
        </span>

        <div class="error-code">
            429
        </div>

        <h1>
            Too many requests.
        </h1>

        <p>
            Planora received too many requests in a short period.
            Wait a moment and try again.
        </p>

        <div class="error-actions">

            <a href="/"
               class="error-primary">
                Back to Planora
            </a>

        </div>

    </div>


    <div class="error-visual">

        <div class="error-illustration">

            <div class="error-warning">
                <span>!</span>
            </div>

            <strong class="error-security-label">
                Request temporarily limited
            </strong>

        </div>

    </div>

</section>

</main>

</body>
</html>
